services:
  app:
    build: .
    image: upskill-to-ai
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=upskill
      - POSTGRES_PASSWORD=upskill
      - POSTGRES_DB=upskill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
