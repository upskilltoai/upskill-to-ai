[project]
name = "upskill-to-ai"
version = "0.1.0"
description = "A verification-driven curriculum that takes a learner from programming competency to practicing AI Engineer."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "ruamel-yaml>=0.18",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytailwindcss>=0.3.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
